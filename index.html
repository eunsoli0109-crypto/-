<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 🎁 계곡 여행 마니또 </title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary-color: #ff6b6b;
      --text-color: #333333;
      --sub-text: #777777;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--primary-color);
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--sub-text);
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #ee5253;
    }

    .result-card {
      display: none;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px dashed #eee;
      animation: fadeIn 0.4s ease-in-out;
    }

    .result-box {
      background-color: #fff0f0;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .target-name {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-top: 5px;
    }

    .mission-box {
      background-color: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      text-align: left;
      margin-bottom: 15px;
    }

    .mission-title {
      font-size: 0.8rem;
      color: var(--primary-color);
      margin-bottom: 5px;
      font-weight: bold;
    }

    .mission-text {
      font-size: 0.92rem;
      line-height: 1.4;
      word-break: keep-all;
    }

    .penalty-box {
      background-color: #fff8e7;
      border: 1px solid #ffe0b2;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.85rem;
      color: #d97706;
      font-weight: bold;
    }

    .error-msg {
      color: #ff4757;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎁 계곡 여행 마니또 </h1>
  <p class="subtitle">이름을 입력하여 당신의 마니또와 미션을 확인하세요!</p>

  <div class="input-group">
    <input type="text" id="username" placeholder="이름을 입력하세요" onkeyup="if(window.event.keyCode==13){checkManitto()}">
  </div>
  <button onclick="checkManitto()">결과 확인하기</button>

  <div id="errorMsg" class="error-msg">명단에 없는 이름입니다. 정확히 입력해 주세요.</div>

  <div id="resultCard" class="result-card">
    <div class="result-box">
      <span style="font-size: 0.85rem; color: #666;">당신이 챙겨야 할 마니또</span>
      <div id="targetName" class="target-name">---</div>
    </div>

    <div class="mission-box">
      <div class="mission-title">🎯 당신의 비밀 미션</div>
      <div id="missionText" class="mission-text">---</div>
    </div>

    <div class="penalty-box">
      ⚠️ 미션 실패 시 벌칙주가 있습니다! 🍺
    </div>
  </div>
</div>

<script>
  // 1. 참여자 18명 명단
  const PARTICIPANTS = [
    "원은솔", "이가을", "강민호", "김태원", "박민순", "배찬율",
    "김규인", "김규형", "김덕양", "도지혁", "김동규", "김민솔",
    "김보연", "손채연", "신의도", "윤시현", "윤찬승", "정현준"
  ];

  // 2. 지정해 주신 미션 18개
  const MISSIONS = [
    "밥 먹을 때나 이동할 때 마니또 근처 자리에 자연스럽게 앉기",
    "마니또가 계곡 물놀이 후 체온 떨어지지 않게 수건이나 겉옷 챙겨주거나 안부 물어보기",
    "바베큐 타임 때 마니또 자리에 수저, 휴지, 물, 쌈채소 중 하나 먼저 셋팅해주기",
    "마니또 대신 술 마셔주기",
    "계곡 물놀이할 때 마니또에게 물 뿌리면서 슬쩍 장난치기",
    "바베큐 때 마니또에게 자연스럽게 음식을 먼저 건네주기",
    "게임 진행할 때 마니또가 하는 말이나 행동에 제일 크게 웃어주고 반응하기",
    "마니또 짐 대신 들어주기",
    "마니또가 가장 좋아하는 음식 알아내기",
    "계곡이나 펜션에서 마니또와 셀카 1장 찍기 (여러명이서 찍어도 가능)",
    "마니또가 요즘 좋아하는 노래 알아내기",
    "마니또가 방학 동안 뭐 하고 지냈는지 알아내기",
    "대화 중 마니또에게 '고마워'라는 말 듣기 (유도하기!)",
    "마니또가 마실 음료나 물을 은근슬쩍 미리 챙겨주기",
    "마니또의 장점이나 오늘 한 잘한 일 1가지 은밀하게 칭찬해주기",
    "단체 사진 찍을 때 마니또 바로 옆이나 앞뒤에 서서 찍기",
    "마니또가 쓰는 소지품(모자, 선글라스, 소품 등) 한 번 자연스럽게 빌려 쓰거나 칭찬하기",
    "마니또에게 자연스럽게 하이파이브 2번 이상 하기"
  ];

  let matchResults = {};

  function seededRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }

  function generateMatches() {
    let names = [...PARTICIPANTS];
    let shuffled = [...PARTICIPANTS];
    
    let seed = 2026082301; // 원하는 결과가 나올 때까지 이 숫자를 변경해 보세요!

    let isValid = false;
    while (!isValid) {
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(seededRandom(seed++) * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      // 본인이 본인을 뽑지 않도록 방지
      isValid = names.every((name, idx) => name !== shuffled[idx]);
    }

    // 미션 목록 무작위 셔플
    let missionPool = [...MISSIONS];
    for (let i = missionPool.length - 1; i > 0; i--) {
      const j = Math.floor(seededRandom(seed++) * (i + 1));
      [missionPool[i], missionPool[j]] = [missionPool[j], missionPool[i]];
    }

    // 1대1 매칭 및 미션 1개씩 부여
    names.forEach((name, idx) => {
      matchResults[name] = {
        target: shuffled[idx],
        mission: missionPool[idx]
      };
    });
  }

  function checkManitto() {
    const inputName = document.getElementById("username").value.trim();
    const errorMsg = document.getElementById("errorMsg");
    const resultCard = document.getElementById("resultCard");

    if (matchResults[inputName]) {
      errorMsg.style.display = "none";
      document.getElementById("targetName").innerText = `${matchResults[inputName].target} 님`;
      document.getElementById("missionText").innerText = matchResults[inputName].mission;
      resultCard.style.display = "block";
    } else {
      resultCard.style.display = "none";
      errorMsg.style.display = "block";
    }
  }

  generateMatches();
</script>

</body>
</html>
