<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 🍉 계곡 여행 마니또 🏖️ </title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary-color: #ff6b6b;
      --text-color: #333333;
      --sub-text: #777777;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--primary-color);
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--sub-text);
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--primary-color);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background-color: #ee5253;
    }

    .result-card {
      display: none;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px dashed #eee;
      animation: fadeIn 0.4s ease-in-out;
    }

    .result-box {
      background-color: #fff0f0;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .target-name {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-top: 5px;
    }

    .cheer-msg {
      font-size: 0.88rem;
      color: #555;
      font-weight: 500;
      margin-bottom: 15px;
    }

    .mission-box {
      background-color: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      text-align: left;
      margin-bottom: 15px;
    }

    .mission-title {
      font-size: 0.8rem;
      color: var(--primary-color);
      margin-bottom: 5px;
      font-weight: bold;
    }

    .mission-text {
      font-size: 0.92rem;
      line-height: 1.4;
      word-break: keep-all;
    }

    .penalty-box {
      background-color: #fff8e7;
      border: 1px solid #ffe0b2;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.85rem;
      color: #d97706;
      font-weight: bold;
    }

    .error-msg {
      color: #ff4757;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎁 계곡 여행 마니또 </h1>
  <p class="subtitle">이름과 비밀번호를 입력하여 결과를 확인하세요!</p>

  <div class="input-group">
    <input type="text" id="username" placeholder="이름을 입력하세요">
  </div>
  <div class="input-group">
    <input type="password" id="userpw" placeholder="비밀번호 4자리 입력" onkeyup="if(window.event.keyCode==13){checkManitto()}">
  </div>
  <button onclick="checkManitto()">결과 확인하기</button>

  <div id="errorMsg" class="error-msg">이름이나 비밀번호가 올바르지 않습니다.</div>

  <div id="resultCard" class="result-card">
    <div class="result-box">
      <span style="font-size: 0.85rem; color: #666;">당신이 챙겨야 할 마니또</span>
      <div id="targetName" class="target-name">---</div>
    </div>

    <div class="cheer-msg">
      오늘 하루 마니또를 잘 챙겨주세요 😊
    </div>

    <div class="mission-box">
      <div class="mission-title">🎯 당신의 비밀 미션</div>
      <div id="missionText" class="mission-text">---</div>
    </div>

    <div class="penalty-box">
      ⚠️ 정체를 들키거나 미션에 실패할 시 벌칙주가 있습니다! 🍺
    </div>
  </div>
</div>

<script>
  // 1. 참여자 18명 명단
  const PARTICIPANTS = [
    "김규인", "김동규", "강민호", "김태원", "박민순", "배찬율",
    "김덕양", "김규형", "원은솔", "도지혁", "이가을", "김민솔",
    "김보연", "손채연", "신의도", "윤시현", "윤찬승", "정현준"
  ];

  // 2. 개별 4자리 비밀번호 설정
  const PASSWORDS = {
    "김덕양": "9237", "김동규": "2841", "강민호": "3910", "김태원": "4523",
    "김민솔": "5812", "배찬율": "6194", "김규인": "7305", "김규형": "8416",
    "원은솔": "1024", "도지혁": "5120", "이가을": "6834", "박민순": "7419",
    "김보연": "8295", "손채연": "9031", "신의도": "1482", "윤시현": "2657",
    "윤찬승": "3709", "정현준": "4862"
  };

  // 3. 미션 18개
  const MISSIONS = [
   "밥 먹을 때나 이동할 때 무조건 마니또 근처에 있기", 
    "숙취해소제 챙겨주기 (단, 둘이 있을 때 주는 건 안됨)",
    "밥이나 간식 먹을 때 무조건 마니또가 가장 먼저 먹게 하기",
    "아이컨택 끊기지 않고 10초 이상 하기",
    "두 번 이상 마니또의 짐 들어주기(짐이 없으면 폰이라도)",
    "마니또에게 두 번 이상 직접 쌈 싸주기",
    "이동할 때 마니또한테 양산 또는 우산 씌워주기 (없으면 부채라도 써서 햇빛 가려주기)",
    "마니또 대신 술 1병 이상 대신 마셔주기",
    "마니또에게 5번 이상 부채질 해주기 (한 번에 몰아서 금지)",
    "마니또가 음식을 먹을 때마다 맛있냐고 물어보기",
    "마니또 초상화 그려주기 (꼭 당일에 그려야 함)",
    "마니또를 5번 진심으로 웃게 하기",
    "마니또랑 단 둘이 사진 찍기",
    "마니또 사진 찍어주기 (무조건 마니또만 나와야 함, 도촬은 안됨)",
    "하루 종일 마니또를 이름 아닌 별명이나 애칭으로 부르기(태원/의도/가을/은솔에게 형/누나 불가능)",
    "물놀이하다가 마니또가 공격당할 때 복수해주기",
    "마니또 이름으로 마니또 앞에서 삼행시 하기",
    "오늘 하루 마니또 이름 50번 이상 부르기"
  ];

  let matchResults = {};

  function seededRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }

  function generateMatches() {
    let names = [...PARTICIPANTS];
    let shuffled = [...PARTICIPANTS];
    
    let seed = 1580;

    let isValid = false;
    while (!isValid) {
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(seededRandom(seed++) * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      isValid = names.every((name, idx) => name !== shuffled[idx]);
    }

    let missionPool = [...MISSIONS];
    for (let i = missionPool.length - 1; i > 0; i--) {
      const j = Math.floor(seededRandom(seed++) * (i + 1));
      [missionPool[i], missionPool[j]] = [missionPool[j], missionPool[i]];
    }

    names.forEach((name, idx) => {
      matchResults[name] = {
        target: shuffled[idx],
        mission: missionPool[idx]
      };
    });
  }

  function checkManitto() {
    const inputName = document.getElementById("username").value.trim();
    const inputPw = document.getElementById("userpw").value.trim();
    const errorMsg = document.getElementById("errorMsg");
    const resultCard = document.getElementById("resultCard");

    if (matchResults[inputName] && PASSWORDS[inputName] === inputPw) {
      errorMsg.style.display = "none";
      document.getElementById("targetName").innerText = `${matchResults[inputName].target} 님`;
      document.getElementById("missionText").innerText = matchResults[inputName].mission;
      resultCard.style.display = "block";
    } else {
      resultCard.style.display = "none";
      errorMsg.style.display = "block";
    }
  }

  generateMatches();
</script>

</body>
</html>
</script>

</body>
</html>
